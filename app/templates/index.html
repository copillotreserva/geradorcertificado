<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Lotes de Calibração 4.1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-container">
        <div class="tab-container">
            <button class="tab-button active" onclick="openTab(event, 'certificados')">Certificados</button>
            <button class="tab-button" onclick="openTab(event, 'coleta')">Coleta de Dados</button>
        </div>

        <div id="certificados" class="tab-content" style="display: block;">
            <div class="grid-container">
                <div class="form-container">
                    <h1>Passo 1: Adicionar Certificados</h1>
                    <form id="form-certificado" onkeydown="handleEnter(event, 'form-certificado')">
                        <input type="hidden" id="edit-index-cert" value="-1">
                        <input type="hidden" name="form_type" value="certificate">

                        <!-- Coluna Esquerda do Formulário -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="barcode-cert">Barcode # (Número da Caixa)</label>
                                <input type="text" id="barcode-cert" name="barcode" required>
                            </div>
                            <div class="form-group">
                                <label for="numero-cert">Nº do Certificado (ex: 123456/78)</label>
                                <input type="text" id="numero-cert" name="numero" required maxlength="9">
                            </div>
                            <div class="form-group">
                                <label for="data-cert">Data da Calibração (dd/mm/aaaa)</label>
                                <input type="text" id="data-cert" name="data" required maxlength="10">
                            </div>
                            <div class="form-group">
                                <label for="instrumento-cert">Instrumento</label>
                                <input type="text" id="instrumento-cert" name="instrumento" required>
                            </div>
                            <div class="form-group">
                                <label for="id_doc-cert">ID (opcional)</label>
                                <input type="text" id="id_doc-cert" name="id_doc">
                            </div>
                        </div>

                        <!-- Coluna Direita do Formulário -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="tag-cert">TAG (opcional)</label>
                                <input type="text" id="tag-cert" name="tag">
                            </div>
                            <div class="form-group">
                                <label for="equipamento-cert">Equipamento (opcional)</label>
                                <input type="text" id="equipamento-cert" name="equipamento">
                            </div>
                            <div class="form-group">
                                <label for="modelo-cert">Modelo (opcional)</label>
                                <input type="text" id="modelo-cert" name="modelo">
                            </div>
                            <div class="form-group">
                                <label for="fabricante-cert">Fabricante (opcional)</label>
                                <input type="text" id="fabricante-cert" name="fabricante">
                            </div>
                            <div class="form-group">
                                <label for="sala-cert">Sala (opcional)</label>
                                <input type="text" id="sala-cert" name="sala">
                            </div>
                            <div class="form-group">
                                <label for="bloco-cert">Bloco (opcional)</label>
                                <input type="text" id="bloco-cert" name="bloco">
                            </div>
                        </div>

                        <div class="form-full-width">
                            <button type="button" id="add-btn-cert" class="btn btn-add">+ Adicionar à Lista</button>
                        </div>
                    </form>
                </div>
                <div class="batch-container">
                    <h2>Passo 2: Gerar Lote</h2>
                    <p>Certificados adicionados nesta caixa:</p>
                    <ul id="lista-certificados"></ul>
                    <form action="{{ url_for('main.gerar_lote_excel') }}" method="post" id="form-lote-cert">
                        <input type="hidden" name="batch_data" id="batch_data_cert">
                        <input type="hidden" name="form_type" value="certificate">
                        <button type="submit" class="btn btn-generate">✔️ Gerar e Baixar Excel</button>
                        <button type="button" id="clear-btn-cert" class="btn btn-clear">🗑️ Limpar Lista</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="coleta" class="tab-content">
            <div class="grid-container">
                <div class="form-container">
                    <h1>Passo 1: Coletar Dados</h1>
                    <form id="form-coleta" onkeydown="handleEnter(event, 'form-coleta')">
                        <input type="hidden" id="edit-index-coleta" value="-1">
                        <input type="hidden" name="form_type" value="data_collection">

                        <!-- Coluna Esquerda do Formulário -->
                        <div class="form-column">
                            <div class="form-group">
                                <label for="barcode-coleta">Barcode # (Número da Caixa)</label>
                                <input type="text" id="barcode-coleta" name="barcode" required>
                            </div>
                            <div class="form-group">
                                <label for="titulo-coleta">Título</label>
                                <div class="checkbox-container">
                                    <input type="checkbox" id="prefix-checkbox" name="prefix_checkbox" checked>
                                    <label for="prefix-checkbox">Formulário de Coleta de Dados</label>
                                </div>
                                <input type="text" id="titulo-coleta" name="titulo" required list="titulos-list">
                                <datalist id="titulos-list"></datalist>
                            </div>
                            <div class="form-group">
                                <label for="data-coleta">Data da Coleta (dd/mm/aaaa)</label>
                                <input type="text" id="data-coleta" name="data" required maxlength="10">
                            </div>
                        </div>

                        <!-- Coluna Direita do Formulário -->
                        <div class="form-column">
                             <div class="form-group">
                                <label for="id_doc-coleta">ID (opcional)</label>
                                <input type="text" id="id_doc-coleta" name="id_doc">
                            </div>
                            <div class="form-group">
                                <label for="tag-coleta">TAG (opcional)</label>
                                <input type="text" id="tag-coleta" name="tag">
                            </div>
                            <div class="form-group">
                                <label for="sala-coleta">Sala (opcional)</label>
                                <input type="text" id="sala-coleta" name="sala">
                            </div>
                            <div class="form-group">
                                <label for="bloco-coleta">Bloco (opcional)</label>
                                <input type="text" id="bloco-coleta" name="bloco">
                            </div>
                        </div>

                        <div class="form-full-width">
                            <button type="button" id="add-btn-coleta" class="btn btn-add">+ Adicionar à Lista</button>
                        </div>
                    </form>
                </div>
                <div class="batch-container">
                    <h2>Passo 2: Gerar Formulário</h2>
                    <p>Itens adicionados para coleta:</p>
                    <ul id="lista-coleta"></ul>
                    <form action="{{ url_for('main.gerar_lote_excel') }}" method="post" id="form-lote-coleta">
                        <input type="hidden" name="batch_data" id="batch_data_coleta">
                        <input type="hidden" name="form_type" value="data_collection">
                        <button type="submit" class="btn btn-generate">✔️ Gerar e Baixar Excel</button>
                        <button type="button" id="clear-btn-coleta" class="btn btn-clear">🗑️ Limpar Lista</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
