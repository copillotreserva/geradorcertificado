<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Lotes de Calibração 4.1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-container">
        <div class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'calibracao')">Certificado de Calibração</button>
            <button class="tab-link" onclick="openTab(event, 'ordem_servico')">Ordem de Serviço</button>
        </div>

        <!-- Aba de Certificado de Calibração -->
        <div id="calibracao" class="tab-content active">
            <div class="grid-container">
                <div class="form-container">
                    <h1>Passo 1: Adicionar Certificados</h1>
                    <form id="form-certificado" onkeydown="handleEnter(event, 'form-certificado', 'add-btn-calibracao')">
                        <input type="hidden" id="edit-index-calibracao" value="-1">
                        <div class="form-column">
                            <div class="form-group"><label for="barcode_calibracao">Barcode # (Nº da Caixa)</label><input type="text" id="barcode_calibracao" name="barcode" required></div>
                            <div class="form-group"><label for="numero">Nº do Certificado (ex: 123456/78)</label><input type="text" id="numero" name="numero" required maxlength="9"></div>
                            <div class="form-group"><label for="data_calibracao">Data (dd/mm/aaaa)</label><input type="text" id="data_calibracao" name="data" required maxlength="10"></div>
                            <div class="form-group"><label for="instrumento">Instrumento</label><input type="text" id="instrumento" name="instrumento" required></div>
                            <div class="form-group"><label for="id_doc">ID (opcional)</label><input type="text" id="id_doc" name="id_doc"></div>
                        </div>
                        <div class="form-column">
                            <div class="form-group"><label for="tag_calibracao">TAG (opcional)</label><input type="text" id="tag_calibracao" name="tag"></div>
                            <div class="form-group"><label for="equipamento_calibracao">Equipamento (opcional)</label><input type="text" id="equipamento_calibracao" name="equipamento"></div>
                            <div class="form-group"><label for="modelo_calibracao">Modelo (opcional)</label><input type="text" id="modelo_calibracao" name="modelo"></div>
                            <div class="form-group"><label for="fabricante_calibracao">Fabricante (opcional)</label><input type="text" id="fabricante_calibracao" name="fabricante"></div>
                            <div class="form-group"><label for="sala">Sala (opcional)</label><input type="text" id="sala" name="sala"></div>
                            <div class="form-group"><label for="bloco_calibracao">Bloco (opcional)</label><input type="text" id="bloco_calibracao" name="bloco"></div>
                        </div>
                        <div class="form-full-width"><button type="button" id="add-btn-calibracao" class="btn btn-add">+ Adicionar à Lista</button></div>
                    </form>
                </div>
                <div class="batch-container">
                    <h2>Passo 2: Gerar Lote</h2>
                    <p>Certificados adicionados:</p>
                    <ul id="lista-calibracao"></ul>
                    <form action="{{ url_for('main.gerar_lote_excel') }}" method="post" id="form-lote-calibracao">
                        <input type="hidden" name="batch_data" id="batch_data_calibracao">
                        <button type="submit" class="btn btn-generate">✔️ Gerar e Baixar Excel</button>
                        <button type="button" id="clear-btn-calibracao" class="btn btn-clear">🗑️ Limpar Lista</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Aba de Ordem de Serviço -->
        <div id="ordem_servico" class="tab-content">
            <div class="grid-container">
                <div class="form-container">
                    <h1>Passo 1: Adicionar Ordens de Serviço</h1>
                    <form id="form-os" onkeydown="handleEnter(event, 'form-os', 'add-btn-os')">
                        <input type="hidden" id="edit-index-os" value="-1">
                        <div class="form-column">
                            <div class="form-group"><label for="os_barcode">Barcode # (Nº da Caixa)</label><input type="text" id="os_barcode" name="barcode" required></div>
                            <div class="form-group"><label for="os_data">Data (dd/mm/aaaa)</label><input type="text" id="os_data" name="data" required maxlength="10"></div>
                            <div class="form-group"><label for="os_tipo">Ordem de Serviço</label><select id="os_tipo" name="tipo_os" required><option value="Corretiva">Corretiva</option><option value="Preventiva">Preventiva</option><option value="Corretiva/Preventiva">Corretiva/Preventiva</option></select></div>
                            <div class="form-group"><label for="os_equipamento">Equipamento</label><input type="text" id="os_equipamento" name="equipamento" required></div>
                        </div>
                        <div class="form-column">
                             <div class="form-group"><label for="os_tag">TAG</label><input type="text" id="os_tag" name="tag" required></div>
                            <div class="form-group"><label for="os_bloco">Localização: Bloco</label><input type="text" id="os_bloco" name="bloco" required></div>
                            <div class="form-group"><label for="os_fabricante">Fabricante</label><input type="text" id="os_fabricante" name="fabricante" required></div>
                            <div class="form-group"><label for="os_modelo">Modelo</label><input type="text" id="os_modelo" name="modelo" required></div>
                        </div>
                        <div class="form-full-width"><button type="button" id="add-btn-os" class="btn btn-add">+ Adicionar à Lista</button></div>
                    </form>
                </div>
                <div class="batch-container">
                    <h2>Passo 2: Gerar Lote</h2>
                    <p>Ordens de Serviço adicionadas:</p>
                    <ul id="lista-os"></ul>
                    <form action="{{ url_for('main.gerar_lote_os_excel') }}" method="post" id="form-lote-os">
                        <input type="hidden" name="batch_data" id="batch_data_os">
                        <button type="submit" class="btn btn-generate">✔️ Gerar e Baixar Excel</button>
                        <button type="button" id="clear-btn-os" class="btn btn-clear">🗑️ Limpar Lista</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
